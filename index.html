<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>جدول العطلة - نسخة متطورة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f3f6fc;
            transition: 0.2s;
            color: #1e293b;
        }
        body.dark {
            background: #0f1724;
            color: #eef2ff;
        }
        /* شاشة الدخول */
        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #eef2ff, #d9e2ec);
        }
        body.dark .auth-wrap {
            background: radial-gradient(circle at 20% 30%, #1e2a3e, #0f1724);
        }
        .auth-card {
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.2);
        }
        body.dark .auth-card {
            background: #1e2a3e;
        }
        .auth-card h2 { text-align: center; margin-bottom: 1.5rem; }
        .auth-card input {
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 1.5rem;
            background: white;
        }
        body.dark .auth-card input {
            background: #0f1724;
            border-color: #2d3e56;
            color: white;
        }
        .checkbox {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            border: none;
            font-weight: bold;
            margin-top: 0.6rem;
            cursor: pointer;
        }
        .btn-primary { background: #1e4668; color: white; }
        .btn-secondary { background: transparent; border: 1px solid #1e4668; color: #1e4668; }
        body.dark .btn-secondary { border-color: #f4a261; color: #f4a261; }
        /* واجهة التطبيق */
        .app-container { max-width: 1400px; margin: 1rem auto; padding: 0 1rem; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            margin-bottom: 2rem;
        }
        body.dark .top-bar { background: #1e2a3ecc; }
        .logo h1 { font-size: 1.5rem; background: linear-gradient(135deg, #1e4668, #f4a261); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .flex-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .sidebar-stats {
            flex: 1.2;
            min-width: 250px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            padding: 1.2rem;
            height: fit-content;
            position: sticky;
            top: 1rem;
        }
        body.dark .sidebar-stats { background: #1e2a3ecc; }
        .content-main {
            flex: 3;
            min-width: 260px;
        }
        .category-card {
            background: rgba(255,255,255,0.7);
            border-radius: 1.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        body.dark .category-card { background: #1e2a3ecc; }
        .cat-header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid;
            font-weight: bold;
        }
        .cat-header.games { border-bottom-color: #3b82f6; }
        .cat-header.movies { border-bottom-color: #ef4444; }
        .cat-header.series { border-bottom-color: #8b5cf6; }
        .task-list {
            padding: 1rem;
            min-height: 150px;
        }
        .task-item {
            background: rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1rem;
            margin-bottom: 0.6rem;
            border-radius: 1.2rem;
            cursor: grab;
        }
        body.dark .task-item { background: #0f1724; }
        .task-check { width: 1.2rem; height: 1.2rem; accent-color: #f4a261; }
        .task-info { flex: 1; display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .delete-btn { background: none; border: none; color: #e53e3e; cursor: pointer; }
        .add-panel {
            margin-top: 2rem;
            background: rgba(255,255,255,0.6);
            border-radius: 1.5rem;
            padding: 1rem;
        }
        body.dark .add-panel { background: #1e2a3ecc; }
        .form-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .form-inline input, .form-inline select {
            flex: 2;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            border: 1px solid #cbd5e1;
        }
        .btn-add { background: #2c5f8a; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; }
        canvas { max-height: 150px; width: 100%; }
        .share-btns { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
        .mobile-stats { display: none; position: fixed; bottom: 1rem; left: 1rem; background: #1e4668; color: white; padding: 0.7rem 1.2rem; border-radius: 3rem; z-index: 99; }
        @media (max-width: 750px) {
            .flex-row { flex-direction: column; }
            .sidebar-stats { position: static; width: 100%; }
            .mobile-stats { display: flex; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<div id="authPage" class="auth-wrap">
    <div class="auth-card">
        <h2><i class="fas fa-calendar-alt"></i> أهلًا بك</h2>
        <input type="text" id="authUsername" placeholder="اسم المستخدم">
        <input type="password" id="authPassword" placeholder="كلمة المرور">
        <div class="checkbox"><input type="checkbox" id="rememberMe"> <label>تذكرني</label></div>
        <div id="authError" style="color:#e53e3e; font-size:0.8rem; margin:0.5rem 0;"></div>
        <button id="loginBtn" class="btn btn-primary">دخول</button>
        <button id="signupBtn" class="btn btn-secondary">إنشاء حساب</button>
    </div>
</div>

<div id="appPage" style="display: none;">
    <div class="app-container">
        <div class="top-bar">
            <div class="logo"><h1><i class="fas fa-list-check"></i> جدول العطلة</h1></div>
            <div style="display: flex; gap: 0.8rem;">
                <span id="userGreeting"></span>
                <button id="darkToggle" class="btn" style="width: auto; padding: 0.3rem 1rem;"><i class="fas fa-moon"></i></button>
                <button id="logoutApp" class="btn" style="width: auto; padding: 0.3rem 1rem;">خروج</button>
            </div>
        </div>
        <div class="flex-row">
            <aside class="sidebar-stats" id="statsPanel">
                <h4><i class="fas fa-chart-pie"></i> الإنجاز</h4>
                <canvas id="totalChart"></canvas>
                <h4 style="margin-top: 1rem;"><i class="fas fa-chart-bar"></i> التوزيع</h4>
                <canvas id="catChart"></canvas>
                <div class="share-btns">
                    <button id="shareBtn" class="btn" style="background:#2c5f8a;">مشاركة الرابط</button>
                    <button id="importBtn" class="btn" style="background:transparent; border:1px solid #2c5f8a;">استيراد من رابط</button>
                </div>
            </aside>
            <div class="content-main" id="categoriesList"></div>
        </div>
        <div class="add-panel">
            <h4>➕ إضافة نشاط جديد</h4>
            <div class="form-inline">
                <input type="text" id="newTaskName" placeholder="الاسم">
                <select id="newTaskType"><option value="Game">لعبة</option><option value="Movie">فيلم</option><option value="Series">مسلسل</option></select>
                <input type="text" id="newTaskSpec" placeholder="مواصفات">
                <button id="addTaskBtn" class="btn-add">إضافة</button>
            </div>
        </div>
    </div>
    <div class="mobile-stats" id="mobileStatsBtn"><i class="fas fa-chart-line"></i> إحصائيات</div>
</div>

<script>
    // ------------------- بيانات المستخدمين -------------------
    let currentUser = null;
    let userItems = [];

    // دوال مساعدة
    function hash(pw) { let h=0; for(let i=0;i<pw.length;i++) h=((h<<5)-h)+pw.charCodeAt(i); return h.toString(); }
    function getUsers() { let u = localStorage.getItem("usersDB_v4"); try { return u ? JSON.parse(u) : {}; } catch(e){ return {}; } }
    function saveUsers(users) { localStorage.setItem("usersDB_v4", JSON.stringify(users)); }
    function defaultTasks() {
        return [
            { id: "g1", name: "Valorant", type: "Game", spec: "i3/4GB", checked: false },
            { id: "g2", name: "Genshin Impact", type: "Game", spec: "GT 1030", checked: false },
            { id: "g3", name: "Stardew Valley", type: "Game", spec: "خفيف", checked: false },
            { id: "g4", name: "Terraria", type: "Game", spec: "ثنائي الأبعاد", checked: false },
            { id: "g5", name: "Rocket League", type: "Game", spec: "GTX 750", checked: false },
            { id: "m1", name: "Inception", type: "Movie", spec: "خيال علمي", checked: false },
            { id: "m2", name: "The Dark Knight", type: "Movie", spec: "جريمة", checked: false },
            { id: "m3", name: "Interstellar", type: "Movie", spec: "فضاء", checked: false },
            { id: "m4", name: "Parasite", type: "Movie", spec: "دراما", checked: false },
            { id: "m5", name: "The Social Network", type: "Movie", spec: "سيرة", checked: false },
            { id: "s1", name: "Breaking Bad", type: "Series", spec: "5 مواسم", checked: false },
            { id: "s2", name: "Stranger Things", type: "Series", spec: "خيال", checked: false },
            { id: "s3", name: "The Witcher", type: "Series", spec: "فانتازيا", checked: false },
            { id: "s4", name: "Money Heist", type: "Series", spec: "تشويق", checked: false },
            { id: "s5", name: "Black Mirror", type: "Series", spec: "أنثولوجيا", checked: false }
        ];
    }

    function signup(u,p){
        if(!u.trim() || !p.trim()) return false;
        let users = getUsers();
        if(users[u]) return false;
        users[u] = { password: hash(p), data: defaultTasks() };
        saveUsers(users);
        return true;
    }
    function login(u,p){
        let users = getUsers();
        if(users[u] && users[u].password === hash(p)){
            currentUser = u;
            userItems = JSON.parse(JSON.stringify(users[u].data));
            return true;
        }
        return false;
    }
    function saveUserData(){
        if(!currentUser) return;
        let users = getUsers();
        if(users[currentUser]){
            users[currentUser].data = JSON.parse(JSON.stringify(userItems));
            saveUsers(users);
        }
    }
    function setSession(u, rem){
        if(rem) localStorage.setItem("activeSesh", u);
        else sessionStorage.setItem("activeSesh", u);
    }
    function clearSession(){
        localStorage.removeItem("activeSesh");
        sessionStorage.removeItem("activeSesh");
    }
    function getSession(){
        return localStorage.getItem("activeSesh") || sessionStorage.getItem("activeSesh");
    }
    function autoLogin(){
        let ses = getSession();
        if(ses && getUsers()[ses]){
            currentUser = ses;
            userItems = JSON.parse(JSON.stringify(getUsers()[ses].data));
            return true;
        }
        return false;
    }

    // ------------------- واجهة المستخدم -------------------
    let totalChart, catChart;
    let sortableInst = [];

    function renderCharts(){
        let total = userItems.length;
        let done = userItems.filter(i=>i.checked).length;
        if(totalChart) totalChart.destroy();
        let ctx = document.getElementById('totalChart').getContext('2d');
        totalChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['منجز', 'متبقي'], datasets: [{ data: [done, total-done], backgroundColor: ['#f4a261','#2c5f8a'] }] } });
        let catCount = { Game:0, Movie:0, Series:0 };
        userItems.forEach(i=>{ if(i.type==='Game') catCount.Game++; else if(i.type==='Movie') catCount.Movie++; else catCount.Series++; });
        if(catChart) catChart.destroy();
        let ctx2 = document.getElementById('catChart').getContext('2d');
        catChart = new Chart(ctx2, { type: 'bar', data: { labels: ['ألعاب','أفلام','مسلسلات'], datasets: [{ data: [catCount.Game, catCount.Movie, catCount.Series], backgroundColor: '#3b82f6' }] } });
    }

    function renderTasks(){
        let container = document.getElementById('categoriesList');
        if(!container) return;
        container.innerHTML = '';
        let groups = { Game: [], Movie: [], Series: [] };
        userItems.forEach(i => groups[i.type].push(i));
        let categories = [
            { key: 'Game', title: '🎮 ألعاب للأجهزة المتوسطة', icon: 'fa-gamepad', color: 'games' },
            { key: 'Movie', title: '🍿 أفلام', icon: 'fa-film', color: 'movies' },
            { key: 'Series', title: '📺 مسلسلات', icon: 'fa-tv', color: 'series' }
        ];
        categories.forEach(cat => {
            let itemsList = groups[cat.key];
            let completed = itemsList.filter(i=>i.checked).length;
            let card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `
                <div class="cat-header ${cat.color}">
                    <span><i class="fas ${cat.icon}"></i> ${cat.title}</span>
                    <span>✔️ ${completed}/${itemsList.length}</span>
                </div>
                <div class="task-list" data-cat="${cat.key}" id="list-${cat.key}"></div>
            `;
            container.appendChild(card);
            let listDiv = card.querySelector(`.task-list`);
            itemsList.forEach(item => {
                let taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                taskDiv.setAttribute('data-id', item.id);
                taskDiv.innerHTML = `
                    <input type="checkbox" class="task-check" data-id="${item.id}" ${item.checked ? 'checked' : ''}>
                    <div class="task-info"><strong>${escapeHtml(item.name)}</strong> ${item.spec ? `<span style="font-size:0.7rem; background:#e2e8f0; padding:0.1rem 0.5rem; border-radius:40px;">⚙️ ${escapeHtml(item.spec)}</span>` : ''}</div>
                    <button class="delete-btn" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                `;
                listDiv.appendChild(taskDiv);
            });
        });
        attachEvents();
        initSortable();
        renderCharts();
    }

    function escapeHtml(s){ return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function attachEvents(){
        // تغيير الـ checkbox
        document.querySelectorAll('.task-check').forEach(cb => {
            let newCb = cb.cloneNode(true);
            cb.parentNode.replaceChild(newCb, cb);
            newCb.addEventListener('change', (e) => {
                let id = newCb.getAttribute('data-id');
                let item = userItems.find(i=>i.id === id);
                if(item) { item.checked = newCb.checked; saveUserData(); renderTasks(); }
            });
        });
        // حذف العنصر
        document.querySelectorAll('.delete-btn').forEach(btn => {
            let newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', () => {
                let id = newBtn.getAttribute('data-id');
                if(confirm('حذف هذا النشاط؟')) {
                    userItems = userItems.filter(i=>i.id !== id);
                    saveUserData();
                    renderTasks();
                }
            });
        });
    }

    function initSortable(){
        if(sortableInst.length) sortableInst.forEach(s=>s.destroy());
        sortableInst = [];
        ['Game','Movie','Series'].forEach(cat => {
            let el = document.getElementById(`list-${cat}`);
            if(el){
                let sort = new Sortable(el, {
                    animation: 150,
                    onEnd: () => {
                        let newOrder = [];
                        el.querySelectorAll('.task-item').forEach(div => {
                            let id = div.getAttribute('data-id');
                            let found = userItems.find(i=>i.id === id);
                            if(found) newOrder.push(found);
                        });
                        let otherItems = userItems.filter(i => i.type !== cat);
                        userItems = [...otherItems, ...newOrder];
                        saveUserData();
                        renderTasks();
                    }
                });
                sortableInst.push(sort);
            }
        });
    }

    function addNewTask(){
        let name = document.getElementById('newTaskName').value.trim();
        if(!name) { alert('الرجاء كتابة الاسم'); return; }
        let type = document.getElementById('newTaskType').value;
        let spec = document.getElementById('newTaskSpec').value.trim();
        if(!spec) spec = 'بدون تفاصيل';
        let newId = 'task_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        userItems.push({ id: newId, name, type, spec, checked: false });
        saveUserData();
        renderTasks();
        document.getElementById('newTaskName').value = '';
        document.getElementById('newTaskSpec').value = '';
    }

    function shareByLink(){
        let dataStr = JSON.stringify(userItems);
        let encoded = btoa(encodeURIComponent(dataStr));
        let url = `${window.location.origin}${window.location.pathname}?share=${encoded}`;
        prompt('انسخ هذا الرابط لمشاركة جدولك:', url);
    }

    function importFromLink(){
        let params = new URLSearchParams(window.location.search);
        let shared = params.get('share');
        if(shared){
            try {
                let decoded = decodeURIComponent(atob(shared));
                let imported = JSON.parse(decoded);
                if(Array.isArray(imported)){
                    userItems = imported;
                    saveUserData();
                    renderTasks();
                    alert('تم استيراد الجدول!');
                    window.history.replaceState({}, '', window.location.pathname);
                } else throw new Error();
            } catch(e){ alert('الرابط غير صالح'); }
        } else {
            alert('لا يوجد جدول مشترك في هذا الرابط');
        }
    }

    // تبديل الواجهات
    function showApp(){
        document.getElementById('authPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'block';
        document.getElementById('userGreeting').innerHTML = `<i class="fas fa-user"></i> ${currentUser}`;
        renderTasks();
    }
    function showAuth(){
        document.getElementById('authPage').style.display = 'flex';
        document.getElementById('appPage').style.display = 'none';
        currentUser = null;
    }

    // الأحداث
    document.getElementById('loginBtn').onclick = () => {
        let u = document.getElementById('authUsername').value.trim();
        let p = document.getElementById('authPassword').value;
        let rem = document.getElementById('rememberMe').checked;
        if(login(u,p)){
            setSession(u, rem);
            showApp();
        } else {
            document.getElementById('authError').innerText = 'خطأ في الاسم أو كلمة المرور';
        }
    };
    document.getElementById('signupBtn').onclick = () => {
        let u = document.getElementById('authUsername').value.trim();
        let p = document.getElementById('authPassword').value;
        let rem = document.getElementById('rememberMe').checked;
        if(!u || !p){ document.getElementById('authError').innerText = 'املأ جميع الحقول'; return; }
        if(signup(u,p)){
            login(u,p);
            setSession(u, rem);
            showApp();
        } else {
            document.getElementById('authError').innerText = 'اسم المستخدم موجود';
        }
    };
    document.getElementById('logoutApp').onclick = () => { clearSession(); showAuth(); };
    document.getElementById('addTaskBtn').onclick = addNewTask;
    document.getElementById('shareBtn').onclick = shareByLink;
    document.getElementById('importBtn').onclick = importFromLink;

    // الوضع المظلم
    let dark = localStorage.getItem('darkTheme') === 'true';
    if(dark) document.body.classList.add('dark');
    document.getElementById('darkToggle').onclick = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkTheme', document.body.classList.contains('dark'));
    };
    // زر الإحصائيات للجوال
    let mobileBtn = document.getElementById('mobileStatsBtn');
    let panel = document.getElementById('statsPanel');
    if(mobileBtn){
        mobileBtn.onclick = () => {
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            setTimeout(() => { panel.style.display = 'block'; }, 5000);
        };
    }

    if(autoLogin()) showApp();
    else showAuth();
</script>
</body>
</html>
