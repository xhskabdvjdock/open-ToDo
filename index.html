<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول العطلة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #E2DDD5;
    --text: #1C1917;
    --text2: #6B6560;
    --text3: #9B938C;
    --accent: #C9622F;
    --accent-bg: #FDF1EB;
    --games: #1D6FA4;
    --games-bg: #EBF4FA;
    --movies: #8B4513;
    --movies-bg: #FBF0E8;
    --series: #4A6741;
    --series-bg: #EDF3EC;
    --success: #4A6741;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 20px rgba(0,0,0,0.1);
  }
  [data-theme="dark"] {
    --bg: #141210;
    --surface: #1F1C19;
    --surface2: #2A2520;
    --border: #3A3530;
    --text: #F0EDE6;
    --text2: #A09890;
    --text3: #6B6460;
    --accent: #E07840;
    --accent-bg: #2A1E15;
    --games: #4A9FD0;
    --games-bg: #0F2030;
    --movies: #D4845A;
    --movies-bg: #251510;
    --series: #7AAD70;
    --series-bg: #152015;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ─── AUTH ─── */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: var(--bg);
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-logo .icon-wrap {
    width: 64px; height: 64px;
    background: var(--accent-bg);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 28px;
    color: var(--accent);
  }
  .auth-logo h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }
  .auth-logo p {
    font-size: 0.85rem;
    color: var(--text3);
    margin-top: 0.3rem;
  }
  .field {
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .field input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    font-size: 0.85rem;
    color: var(--text2);
    cursor: pointer;
  }
  .checkbox-row input { width: auto; }
  .auth-error {
    background: #FEF2F2;
    color: #991B1B;
    border-radius: var(--radius-sm);
    padding: 0.6rem 1rem;
    font-size: 0.82rem;
    margin-bottom: 1rem;
    display: none;
  }
  [data-theme="dark"] .auth-error { background: #2A1010; color: #FCA5A5; }
  .auth-error.show { display: block; }
  .btn-main {
    width: 100%;
    padding: 0.85rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 0.7rem;
  }
  .btn-main:hover { opacity: 0.9; }
  .btn-main:active { transform: scale(0.99); }
  .btn-outline {
    width: 100%;
    padding: 0.8rem;
    background: transparent;
    color: var(--text2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── APP ─── */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .navbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
  }
  .nav-brand .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .nav-user {
    font-size: 0.8rem;
    color: var(--text2);
    padding: 0.4rem 0.8rem;
    background: var(--surface2);
    border-radius: 30px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 17px;
    transition: background 0.2s, color 0.2s;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }

  .main-layout {
    display: flex;
    gap: 1.5rem;
    padding: 1.5rem;
    max-width: 1300px;
    margin: 0 auto;
    width: 100%;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
  }
  .sidebar-inner {
    position: sticky;
    top: 76px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text2); display: flex; align-items: center; gap: 0.4rem; }
  .stat-row .value { font-weight: 600; color: var(--text); }
  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 999px;
    margin: 0.8rem 0 0.5rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text3);
  }
  .cat-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.7rem;
    border-radius: var(--radius-sm);
    margin-bottom: 0.5rem;
    font-size: 0.82rem;
  }
  .cat-pill.games { background: var(--games-bg); color: var(--games); }
  .cat-pill.movies { background: var(--movies-bg); color: var(--movies); }
  .cat-pill.series { background: var(--series-bg); color: var(--series); }
  .cat-pill .count { font-weight: 700; font-size: 1rem; }
  .share-section { display: flex; flex-direction: column; gap: 0.5rem; }
  .share-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .share-btn:hover { background: var(--surface2); color: var(--text); }

  /* ─── CONTENT ─── */
  .content { flex: 1; min-width: 0; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .section-badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 99px;
  }
  .section-badge.games { background: var(--games-bg); color: var(--games); }
  .section-badge.movies { background: var(--movies-bg); color: var(--movies); }
  .section-badge.series { background: var(--series-bg); color: var(--series); }

  .task-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1rem;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border);
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .group-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .group-icon.games { background: var(--games-bg); color: var(--games); }
  .group-icon.movies { background: var(--movies-bg); color: var(--movies); }
  .group-icon.series { background: var(--series-bg); color: var(--series); }
  .group-progress {
    font-size: 0.75rem;
    color: var(--text3);
    background: var(--surface2);
    padding: 0.25rem 0.7rem;
    border-radius: 99px;
    font-weight: 600;
  }

  .task-list { padding: 0.5rem; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.65rem 0.8rem;
    border-radius: var(--radius-sm);
    cursor: grab;
    transition: background 0.15s;
    user-select: none;
  }
  .task-item:hover { background: var(--surface2); }
  .task-item.checked .task-name { text-decoration: line-through; opacity: 0.4; }
  .custom-check {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-size: 11px;
    color: white;
  }
  .custom-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-name {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text);
    transition: opacity 0.2s;
  }
  .task-spec {
    font-size: 0.72rem;
    color: var(--text3);
    background: var(--surface2);
    padding: 0.15rem 0.5rem;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .task-delete {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: #FEE2E2; color: #991B1B; }
  [data-theme="dark"] .task-delete:hover { background: #2A1010; color: #FCA5A5; }
  .drag-handle {
    color: var(--text3);
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.15s;
    cursor: grab;
    flex-shrink: 0;
  }
  .task-item:hover .drag-handle { opacity: 1; }

  /* ─── ADD FORM ─── */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }
  .add-card-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
  }
  .add-form {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .add-form input, .add-form select {
    padding: 0.6rem 0.9rem;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-form input:focus, .add-form select:focus { border-color: var(--accent); }
  .add-form .input-name { flex: 2; min-width: 130px; }
  .add-form .input-spec { flex: 1.5; min-width: 110px; }
  .add-form select { flex: 1; min-width: 110px; }
  .btn-add {
    padding: 0.6rem 1.2rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn-add:hover { opacity: 0.88; }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text3);
    font-size: 0.85rem;
  }
  .empty-state i { font-size: 2rem; margin-bottom: 0.5rem; display: block; opacity: 0.4; }

  /* ─── CHART ─── */
  .mini-chart { height: 120px; position: relative; }

  /* ─── SORTABLE ─── */
  .sortable-ghost { opacity: 0.4; background: var(--surface2) !important; }
  .sortable-drag { box-shadow: var(--shadow-lg); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .main-layout { flex-direction: column; padding: 1rem; gap: 1rem; }
    .sidebar { width: 100%; }
    .sidebar-inner { position: static; }
    .navbar { padding: 0 1rem; }
    .nav-user { display: none; }
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item { animation: fadeIn 0.2s ease; }
  .task-group { animation: fadeIn 0.25s ease; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon-wrap"><i class="ti ti-list-check"></i></div>
      <h1>جدول العطلة</h1>
      <p>نظّم وقت فراغك بذكاء</p>
    </div>
    <div id="authError" class="auth-error"></div>
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="authUser" placeholder="أدخل اسمك">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="authPass" placeholder="••••••••">
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="rememberMe">
      <span>تذكّرني</span>
    </label>
    <button class="btn-main" id="loginBtn">دخول</button>
    <button class="btn-outline" id="signupBtn">إنشاء حساب جديد</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="app">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="dot"></div>
      جدول العطلة
    </div>
    <div class="nav-actions">
      <span class="nav-user" id="navUser"></span>
      <button class="icon-btn" id="darkBtn" title="الوضع الليلي"><i class="ti ti-moon"></i></button>
      <button class="icon-btn" id="logoutBtn" title="خروج"><i class="ti ti-logout"></i></button>
    </div>
  </nav>

  <div class="main-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="card">
          <div class="card-title"><i class="ti ti-chart-pie" aria-hidden="true"></i> الإنجاز الكلي</div>
          <div class="mini-chart"><canvas id="donutChart"></canvas></div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label">
            <span id="progressDone">0 منجز</span>
            <span id="progressPct">0%</span>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><i class="ti ti-layout-grid" aria-hidden="true"></i> التوزيع</div>
          <div id="catStats"></div>
        </div>

        <div class="card">
          <div class="card-title"><i class="ti ti-share" aria-hidden="true"></i> المشاركة</div>
          <div class="share-section">
            <button class="share-btn" id="shareBtn"><i class="ti ti-link" aria-hidden="true"></i> نسخ رابط المشاركة</button>
            <button class="share-btn" id="importBtn"><i class="ti ti-download" aria-hidden="true"></i> استيراد من رابط</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- CONTENT -->
    <main class="content">
      <div class="add-card">
        <div class="add-card-title"><i class="ti ti-plus" aria-hidden="true"></i> إضافة نشاط</div>
        <div class="add-form">
          <input class="input-name" type="text" id="newName" placeholder="اسم النشاط...">
          <select id="newType">
            <option value="Game">🎮 لعبة</option>
            <option value="Movie">🎬 فيلم</option>
            <option value="Series">📺 مسلسل</option>
          </select>
          <input class="input-spec" type="text" id="newSpec" placeholder="مواصفات أو ملاحظة...">
          <button class="btn-add" id="addBtn"><i class="ti ti-plus" aria-hidden="true"></i> إضافة</button>
        </div>
      </div>
      <div id="taskGroups"></div>
    </main>
  </div>
</div>

<script>
const CATS = {
  Game:   { label: 'ألعاب', icon: 'ti-device-gamepad-2', cls: 'games', emoji: '🎮' },
  Movie:  { label: 'أفلام', icon: 'ti-device-tv', cls: 'movies', emoji: '🎬' },
  Series: { label: 'مسلسلات', icon: 'ti-brand-netflix', cls: 'series', emoji: '📺' }
};

let currentUser = null, items = [];
let donutInst = null;
let sortables = [];

// ─── Helpers ───
const h = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hash = pw => { let v=5381; for(let i=0;i<pw.length;i++) v=((v<<5)+v)^pw.charCodeAt(i); return v.toString(36); };
const uid = () => 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
const getUsers = () => { try { return JSON.parse(localStorage.getItem('j_users_v5') || '{}'); } catch{return {};} };
const saveUsers = u => localStorage.setItem('j_users_v5', JSON.stringify(u));
const getSession = () => localStorage.getItem('j_ses') || sessionStorage.getItem('j_ses');
const setSession = (u, rem) => (rem ? localStorage : sessionStorage).setItem('j_ses', u);
const clearSession = () => { localStorage.removeItem('j_ses'); sessionStorage.removeItem('j_ses'); };

function defaultItems() {
  return [
    {id:uid(),name:'Valorant',type:'Game',spec:'i3 / 8GB RAM',checked:false},
    {id:uid(),name:'Stardew Valley',type:'Game',spec:'خفيف جداً',checked:false},
    {id:uid(),name:'Genshin Impact',type:'Game',spec:'GT 1030+',checked:false},
    {id:uid(),name:'Rocket League',type:'Game',spec:'GTX 750+',checked:false},
    {id:uid(),name:'Terraria',type:'Game',spec:'ثنائي الأبعاد',checked:false},
    {id:uid(),name:'Inception',type:'Movie',spec:'خيال علمي',checked:false},
    {id:uid(),name:'The Dark Knight',type:'Movie',spec:'أكشن / جريمة',checked:false},
    {id:uid(),name:'Interstellar',type:'Movie',spec:'فضاء',checked:false},
    {id:uid(),name:'Parasite',type:'Movie',spec:'دراما / تشويق',checked:false},
    {id:uid(),name:'The Social Network',type:'Movie',spec:'سيرة ذاتية',checked:false},
    {id:uid(),name:'Breaking Bad',type:'Series',spec:'5 مواسم',checked:false},
    {id:uid(),name:'Stranger Things',type:'Series',spec:'خيال علمي',checked:false},
    {id:uid(),name:'Money Heist',type:'Series',spec:'4 مواسم',checked:false},
    {id:uid(),name:'Black Mirror',type:'Series',spec:'أنثولوجيا',checked:false},
    {id:uid(),name:'The Witcher',type:'Series',spec:'فانتازيا',checked:false}
  ];
}

function signup(u, p) {
  const users = getUsers();
  if (!u || !p || users[u]) return false;
  users[u] = { pw: hash(p), items: defaultItems() };
  saveUsers(users); return true;
}
function login(u, p) {
  const users = getUsers();
  if (users[u] && users[u].pw === hash(p)) {
    currentUser = u;
    items = JSON.parse(JSON.stringify(users[u].items));
    return true;
  }
  return false;
}
function saveData() {
  if (!currentUser) return;
  const users = getUsers();
  if (users[currentUser]) { users[currentUser].items = JSON.parse(JSON.stringify(items)); saveUsers(users); }
}
function autoLogin() {
  const ses = getSession(); const users = getUsers();
  if (ses && users[ses]) { currentUser = ses; items = JSON.parse(JSON.stringify(users[ses].items)); return true; }
  return false;
}

// ─── Render ───
function renderSidebar() {
  const total = items.length, done = items.filter(i=>i.checked).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressDone').textContent = done + ' منجز';
  document.getElementById('progressPct').textContent = pct + '%';

  const catStats = document.getElementById('catStats');
  catStats.innerHTML = '';
  Object.keys(CATS).forEach(k => {
    const cat = CATS[k];
    const all = items.filter(i=>i.type===k);
    const d = all.filter(i=>i.checked).length;
    catStats.innerHTML += `
      <div class="cat-pill ${cat.cls}">
        <span><i class="ti ${cat.icon}" aria-hidden="true"></i> ${cat.label}</span>
        <span class="count">${d}/${all.length}</span>
      </div>`;
  });

  if (donutInst) donutInst.destroy();
  const ctx = document.getElementById('donutChart').getContext('2d');
  donutInst = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['منجز','متبقي'],
      datasets: [{ data: [done, total-done], backgroundColor: ['#C9622F','#E2DDD5'], borderWidth: 0, borderRadius: 4, spacing: 2 }]
    },
    options: {
      cutout: '72%', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw}` } } }
    }
  });
}

function renderGroups() {
  const container = document.getElementById('taskGroups');
  container.innerHTML = '';
  sortables.forEach(s => s.destroy());
  sortables = [];

  const grouped = {};
  Object.keys(CATS).forEach(k => grouped[k] = []);
  items.forEach(i => { if (grouped[i.type]) grouped[i.type].push(i); });

  Object.keys(CATS).forEach(k => {
    const cat = CATS[k];
    const list = grouped[k];
    const done = list.filter(i=>i.checked).length;

    const group = document.createElement('div');
    group.className = 'task-group';
    group.innerHTML = `
      <div class="group-header">
        <div class="group-title">
          <div class="group-icon ${cat.cls}"><i class="ti ${cat.icon}" aria-hidden="true"></i></div>
          ${cat.label}
        </div>
        <span class="group-progress">${done} / ${list.length}</span>
      </div>
      <div class="task-list" id="list-${k}"></div>`;
    container.appendChild(group);

    const listEl = document.getElementById('list-'+k);
    if (!list.length) {
      listEl.innerHTML = `<div class="empty-state"><i class="ti ti-inbox" aria-hidden="true"></i>لا يوجد عناصر</div>`;
    } else {
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'task-item' + (item.checked ? ' checked' : '');
        div.dataset.id = item.id;
        div.innerHTML = `
          <i class="ti ti-grip-vertical drag-handle" aria-hidden="true"></i>
          <div class="custom-check ${item.checked?'checked':''}">
            ${item.checked ? '<i class="ti ti-check" aria-hidden="true"></i>' : ''}
          </div>
          <span class="task-name">${h(item.name)}</span>
          ${item.spec ? `<span class="task-spec">${h(item.spec)}</span>` : ''}
          <button class="task-delete" title="حذف"><i class="ti ti-trash" aria-hidden="true"></i></button>`;
        listEl.appendChild(div);

        div.querySelector('.custom-check').addEventListener('click', () => {
          const it = items.find(i=>i.id===item.id);
          if (it) { it.checked = !it.checked; saveData(); renderAll(); }
        });
        div.querySelector('.task-delete').addEventListener('click', () => {
          if (confirm('حذف "' + item.name + '"؟')) {
            items = items.filter(i=>i.id!==item.id);
            saveData(); renderAll();
          }
        });
      });
    }

    const s = Sortable.create(listEl, {
      animation: 180,
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      handle: '.drag-handle',
      onEnd: () => {
        const ids = [...listEl.querySelectorAll('.task-item')].map(d=>d.dataset.id);
        const catItems = ids.map(id=>items.find(i=>i.id===id)).filter(Boolean);
        const others = items.filter(i=>i.type!==k);
        items = [...others, ...catItems];
        saveData();
      }
    });
    sortables.push(s);
  });
}

function renderAll() { renderSidebar(); renderGroups(); }

// ─── Events ───
function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('navUser').innerHTML = `<i class="ti ti-user" aria-hidden="true" style="font-size:14px;margin-left:4px"></i>${currentUser}`;
  renderAll();
}
function showAuth() {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  currentUser = null;
}

document.getElementById('loginBtn').onclick = () => {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if (!u || !p) { showError('يرجى إدخال الاسم وكلمة المرور'); return; }
  if (login(u,p)) { setSession(u, document.getElementById('rememberMe').checked); showApp(); }
  else showError('اسم المستخدم أو كلمة المرور غير صحيحة');
};
document.getElementById('signupBtn').onclick = () => {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if (!u || !p) { showError('يرجى إدخال الاسم وكلمة المرور'); return; }
  if (!signup(u,p)) { showError('اسم المستخدم موجود بالفعل'); return; }
  login(u,p); setSession(u, document.getElementById('rememberMe').checked); showApp();
};
document.getElementById('authUser').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('authPass').focus(); });
document.getElementById('authPass').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').onclick = () => { clearSession(); showAuth(); };
document.getElementById('addBtn').onclick = () => {
  const name = document.getElementById('newName').value.trim();
  if (!name) { document.getElementById('newName').focus(); return; }
  const spec = document.getElementById('newSpec').value.trim();
  items.push({ id: uid(), name, type: document.getElementById('newType').value, spec: spec||'', checked: false });
  saveData(); renderAll();
  document.getElementById('newName').value = '';
  document.getElementById('newSpec').value = '';
  document.getElementById('newName').focus();
};
document.getElementById('newName').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('addBtn').click(); });

document.getElementById('shareBtn').onclick = () => {
  const encoded = btoa(encodeURIComponent(JSON.stringify(items)));
  const url = `${location.origin}${location.pathname}?share=${encoded}`;
  try { navigator.clipboard.writeText(url); alert('تم نسخ الرابط!'); }
  catch { prompt('انسخ الرابط:', url); }
};
document.getElementById('importBtn').onclick = () => {
  const p = new URLSearchParams(location.search).get('share');
  if (!p) { alert('لا يوجد جدول مشترك في الرابط الحالي'); return; }
  try {
    const data = JSON.parse(decodeURIComponent(atob(p)));
    if (!Array.isArray(data)) throw new Error();
    items = data; saveData(); renderAll();
    alert('تم استيراد الجدول بنجاح!');
    history.replaceState({}, '', location.pathname);
  } catch { alert('الرابط غير صالح'); }
};

// ─── Dark mode ───
const setTheme = dark => {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  localStorage.setItem('j_dark', dark);
  const btn = document.getElementById('darkBtn');
  btn.innerHTML = dark ? '<i class="ti ti-sun"></i>' : '<i class="ti ti-moon"></i>';
};
const isDark = localStorage.getItem('j_dark') === 'true';
setTheme(isDark);
document.getElementById('darkBtn').onclick = () => {
  setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  if (donutInst) { setTimeout(renderAll, 50); }
};

// ─── Init ───
if (autoLogin()) showApp(); else showAuth();
</script>
</body>
</html>
